# Docker Compose override for Coston2 deployment.
# Usage: docker compose -f docker-compose.yaml -f docker-compose.coston2.yaml up
services:
  ext-proxy:
    volumes:
      - ./config/proxy/extension_proxy.coston2.docker.toml:/app/config/config.toml:ro

  extension-tee:
    # Lets the enclave reach a stub exchange running on the host, for demo runs
    # with no exchange account. Only used when VAULTPROOF_EXCHANGE_BASE_URL is
    # set; unset, the enclave talks to the real exchange and this is inert.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CHAIN_URL=${CHAIN_URL:-https://coston2-api.flare.network/ext/C/rpc}
      # Simulated runs only — refused on real hardware by CheckExchangeOverride.
      - VAULTPROOF_EXCHANGE_BASE_URL=${VAULTPROOF_EXCHANGE_BASE_URL:-}
      # Coston2 chain id. The node binds every signature to this value; it must
      # match the proxy's chain_id (114) and the on-chain registry, or signature
      # verification fails (InvalidTeePublicKeyOrSignature / proxy panic).
      - CHAIN_ID=${CHAIN_ID:-114}
      # CORS allowlist for the browser-facing endpoints below. Empty = any origin.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    # VaultProof only: /quote and /sealed are called by the user's BROWSER, not
    # by FTDC providers, so the extension port needs a host binding — the base
    # compose exposes only the proxy (6664). Bound to loopback by default; a
    # public deployment routes HTTPS to it (see docs/coston2-simulated.md) and
    # sets ALLOWED_ORIGINS to the frontend's origin.
    ports:
      - "${EXTENSION_BIND:-127.0.0.1:7702}:7702"

networks:
  default:
    name: ${COMPOSE_NETWORK:-extension-scaffold-coston2}
    external: false
